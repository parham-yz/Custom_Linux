font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.5

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0
scrollback_lines 20000
mouse_hide_wait 2.0
url_style curly

# Kitty defaults to a latency-first 100 FPS update loop. A 30 ms repaint
# interval keeps streaming TUIs responsive while reducing needless redraw work.
repaint_delay 30
sync_to_monitor yes

window_padding_width 12
background_opacity 0.92
background_blur 24
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes

# Hyprland translates the physical Mac Command key to these terminal-safe
# private chords. Keep them explicit so Command+C/Z/S never reaches the shell
# as SIGINT, suspend, or terminal flow control.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f show_scrollback
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+n new_os_window
map ctrl+shift+k clear_terminal reset active
map ctrl+shift+q quit
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

tab_bar_edge bottom
tab_bar_style fade
tab_fade 1 0.5 0
include ../obsidian-ember/current/kitty.conf

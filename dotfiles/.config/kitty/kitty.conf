font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.5

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0
scrollback_lines 20000
mouse_hide_wait 2.0
url_style curly

# Kitty defaults to a latency-first 100 FPS update loop. A 30 ms repaint
# interval keeps streaming TUIs responsive while reducing needless redraw work.
repaint_delay 30
sync_to_monitor yes

window_padding_width 12
background_opacity 0.92
background_blur 24
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes

# Hyprland translates the physical Mac Command key to these terminal-safe
# shortcuts. Keep them explicit so Command+C never reaches the shell as SIGINT.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

tab_bar_edge bottom
tab_bar_style fade
tab_fade 1 0.5 0
include ../obsidian-ember/current/kitty.conf

format = "[╭─](#a49688)$directory$git_branch$git_status$fill$cmd_duration$time\n[╰─](#a49688)$character"
add_newline = true

[directory]
style = "bold #e7c18c"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = "git:"
style = "#d6a15f"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "#dc806f"
format = "[$all_status$ahead_behind ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 500
style = "#a49688"
format = "[took $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "#a49688"
format = "[$time ]($style)"

[character]
success_symbol = "[❯](bold #d6a15f)"
error_symbol = "[❯](bold #dc806f)"

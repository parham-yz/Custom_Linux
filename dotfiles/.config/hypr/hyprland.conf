# Universal clipboard history, capture, and Omarchy-style utilities
bind = $mainMod CTRL, V, exec, ~/.local/bin/obsidian-clipboard open
bind = $mainMod CTRL, E, exec, ~/.local/bin/obsidian-emoji
bind = , Print, exec, ~/.local/bin/obsidian-capture region
bind = SHIFT, Print, exec, ~/.local/bin/obsidian-capture screen
bind = ALT, Print, exec, ~/.local/bin/obsidian-record toggle
bind = $mainMod, Print, exec, ~/.local/bin/obsidian-capture color
bind = $mainMod CTRL, Print, exec, ~/.local/bin/obsidian-capture ocr
bind = $mainMod CTRL, C, exec, ~/.local/bin/obsidian-menu capture
bind = $mainMod CTRL, T, exec, $terminal btop --force-utf --config ~/.config/btop/obsidian-ember.conf
bind = $mainMod CTRL, A, exec, sh -c 'command -v pavucontrol >/dev/null && exec pavucontrol || exec kitty alsamixer'
bind = $mainMod CTRL, W, exec, nm-connection-editor
bind = $mainMod CTRL, R, exec, ~/.local/bin/obsidian-reminder set
bind = $mainMod CTRL ALT, R, exec, ~/.local/bin/obsidian-reminder show
bind = $mainMod CTRL SHIFT, R, exec, ~/.local/bin/obsidian-reminder clear
bind = $mainMod CTRL ALT, T, exec, ~/.local/bin/obsidian-notice time
bind = $mainMod CTRL ALT, B, exec, ~/.local/bin/obsidian-notice battery
bind = $mainMod CTRL ALT, W, exec, ~/.local/bin/obsidian-notice weather
bind = $mainMod CTRL, Space, exec, ~/.local/bin/obsidian-theme wallpaper
bind = $mainMod CTRL SHIFT, Space, exec, ~/.local/bin/obsidian-theme switch
bind = $mainMod SHIFT, Space, exec, ~/.local/bin/obsidian-toggle bar
bind = $mainMod SHIFT, Backspace, exec, ~/.local/bin/obsidian-toggle gaps
bind = $mainMod CTRL, I, exec, ~/.local/bin/obsidian-toggle idle
bind = $mainMod CTRL, N, exec, ~/.local/bin/obsidian-toggle nightlight
bind = $mainMod CTRL, P, exec, ~/.local/bin/obsidian-power toggle
bind = $mainMod ALT, comma, exec, makoctl dismiss
bind = $mainMod ALT SHIFT, comma, exec, makoctl dismiss --all
bind = $mainMod CTRL, comma, exec, ~/.local/bin/obsidian-toggle notifications
bind = $mainMod ALT CTRL, comma, exec, makoctl invoke
bind = $mainMod ALT CTRL SHIFT, comma, exec, makoctl restore
bind = $mainMod, slash, exec, ~/.local/bin/obsidian-display next
bind = $mainMod ALT, slash, exec, ~/.local/bin/obsidian-display previous

# MacBook media, display, and keyboard backlight controls
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/obsidian-osd volume-up 5
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/obsidian-osd volume-down 5
bindel = ALT, XF86AudioRaiseVolume, exec, ~/.local/bin/obsidian-osd volume-up 1
bindel = ALT, XF86AudioLowerVolume, exec, ~/.local/bin/obsidian-osd volume-down 1
bindl = , XF86AudioMute, exec, ~/.local/bin/obsidian-osd volume-mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/obsidian-osd brightness-up 5
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/obsidian-osd brightness-down 5
bindel = ALT, XF86MonBrightnessUp, exec, ~/.local/bin/obsidian-osd brightness-up 1
bindel = ALT, XF86MonBrightnessDown, exec, ~/.local/bin/obsidian-osd brightness-down 1
bindel = SHIFT, XF86MonBrightnessUp, exec, ~/.local/bin/obsidian-osd brightness-set 100%
bindel = SHIFT, XF86MonBrightnessDown, exec, ~/.local/bin/obsidian-osd brightness-set 1%
bindel = , XF86KbdBrightnessUp, exec, brightnessctl --device='*kbd_backlight*' set 10%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl --device='*kbd_backlight*' set 10%-

# Keep personal push-to-talk controls separate from the desktop/theme bindings.
source = ~/.config/hypr/push-to-talk.conf

# Obsidian Ember — Omarchy-inspired Hyprland for Fedora Asahi Remix

# Full-height MacBook Air Retina panel. Waybar flows around the physical notch.
monitor = eDP-1, preferred, auto, 1.6
monitor = , preferred, auto, 1

source = ~/.config/obsidian-ember/current/hyprland.conf

$terminal = kitty
$browser = firefox
$fileManager = dolphin
$menu = rofi -show drun -show-icons
$mainMod = SUPER

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = mako
# Theme restore renders the palette first, then starts Waybar. Keeping one
# startup owner avoids a SIGUSR2 reset racing Waybar's initial layer surface.
exec-once = ~/.local/bin/obsidian-theme restore
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = ~/.local/bin/obsidian-clipboard watch
exec-once = systemctl --user start --no-block obsidian-power.service obsidian-idle.service hyprwhspr.service

env = XCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt5ct

input {
    kb_layout = us
    kb_options = compose:caps
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 0.75
    }
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = $activeBorder1 $activeBorder2 45deg
    col.inactive_border = $inactiveBorder
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = false
        vibrancy = 0.12
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = $shadowColor
        offset = 0 5
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    animation = windows, 1, 4, easeOutQuint, popin 88%
    animation = windowsOut, 1, 3, easeInOutCubic, popin 88%
    animation = border, 1, 7, default
    animation = fade, 1, 4, easeOutQuint
    animation = workspaces, 1, 5, easeOutQuint, slide
}

dwindle {
    preserve_split = true
    smart_split = false
}

gestures {
    workspace_swipe_distance = 280
}

gesture = 3, horizontal, workspace

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
}

debug {
    vfr = true
}

windowrule = suppress_event maximize, match:class .*
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = size 420 260, match:title ^(Picture-in-Picture)$
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi

# Apps and the Omarchy-style control surface
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $browser
bind = $mainMod ALT, Return, exec, $terminal tmux new-session -A -s main
bind = $mainMod, Space, exec, $menu
bind = $mainMod ALT, Space, exec, ~/.local/bin/obsidian-menu
bind = $mainMod, Escape, exec, ~/.local/bin/obsidian-menu system
bind = $mainMod ALT, K, exec, ~/.local/bin/obsidian-keybindings
bind = $mainMod ALT SHIFT, F, exec, $fileManager
bind = $mainMod ALT SHIFT, T, exec, $terminal btop --force-utf --config ~/.config/btop/obsidian-ember.conf
bind = $mainMod ALT SHIFT, N, exec, $terminal nvim
bind = $mainMod ALT SHIFT, B, exec, $browser
bind = $mainMod SHIFT ALT, B, exec, $browser --private-window
bind = $mainMod ALT SHIFT, A, exec, $browser --new-window https://chatgpt.com
bind = $mainMod ALT SHIFT, Y, exec, $browser --new-window https://youtube.com

# Window control. Bare Command combinations are reserved for application
# shortcuts below; add Option for compositor/window-management actions.
bind = CTRL ALT, Delete, exec, ~/.local/bin/obsidian-close-all
bind = $mainMod ALT, T, togglefloating
bind = $mainMod ALT, F, fullscreen, 0
bind = $mainMod ALT, J, layoutmsg, togglesplit
bind = $mainMod ALT, P, pseudo
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d
bind = $mainMod ALT SHIFT, left, swapwindow, l
bind = $mainMod ALT SHIFT, right, swapwindow, r
bind = $mainMod ALT SHIFT, up, swapwindow, u
bind = $mainMod ALT SHIFT, down, swapwindow, d
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop
bind = $mainMod, Tab, cyclenext
bind = $mainMod, Tab, bringactivetotop
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, bringactivetotop
bind = $mainMod ALT, equal, resizeactive, -100 0
bind = $mainMod ALT, minus, resizeactive, 100 0
bind = $mainMod ALT SHIFT, equal, resizeactive, 0 100
bind = $mainMod ALT SHIFT, minus, resizeactive, 0 -100
bind = $mainMod ALT, G, togglegroup
bind = $mainMod ALT CTRL, G, moveoutofgroup
bind = $mainMod ALT, bracketright, changegroupactive, f
bind = $mainMod ALT, bracketleft, changegroupactive, b
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces
bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, workspace, 10
bind = $mainMod ALT SHIFT, 1, movetoworkspace, 1
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 2
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 3
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 4
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 5
bind = $mainMod ALT SHIFT, 6, movetoworkspace, 6
bind = $mainMod ALT SHIFT, 7, movetoworkspace, 7
bind = $mainMod ALT SHIFT, 8, movetoworkspace, 8
bind = $mainMod ALT SHIFT, 9, movetoworkspace, 9
bind = $mainMod ALT SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL ALT SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL ALT SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL ALT SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL ALT SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL ALT SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL ALT SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL ALT SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL ALT SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL ALT SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL ALT SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL, Tab, workspace, previous
bind = $mainMod ALT, S, togglespecialworkspace, scratchpad
bind = $mainMod ALT SHIFT, S, movetoworkspacesilent, special:scratchpad
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# Persistent push-to-talk bindings for hyprwhspr.
# MacBook Air bare F5 is exposed as KEY_MICMUTE / XF86AudioMicMute.
bindd = , XF86AudioMicMute, Speech-to-text, exec, echo "start" > ~/.config/hyprwhspr/recording_control
bindr = , XF86AudioMicMute, exec, echo "stop" > ~/.config/hyprwhspr/recording_control

# Backup: hold Super+Alt+D and release to transcribe.
bindd = SUPER ALT, D, Speech-to-text, exec, echo "start" > ~/.config/hyprwhspr/recording_control
bindr = SUPER ALT, D, exec, echo "stop" > ~/.config/hyprwhspr/recording_control

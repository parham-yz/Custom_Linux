# Native bar panel and background assistant; the browser workspace is optional.
exec-once = systemctl --user start --no-block obsidian-hermes.service obsidian-hermes-health.timer
bind = $mainMod SHIFT CTRL, H, exec, ~/.local/bin/obsidian-hermes open
windowrule = workspace special:hermes silent, match:class ^(org\.obsidian\.hermes)$
workspace = special:hermes, gapsout:36, gapsin:4

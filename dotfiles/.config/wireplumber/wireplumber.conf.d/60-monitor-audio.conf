# Prefer display speakers to the Asahi speaker DSP (850), but allow wired
# headphones (1009), Bluetooth audio (1010), and USB audio (1100+) to win.
# Keep manual output selections available through the normal sound settings.
monitor.alsa.rules = [
  {
    matches = [
      { media.class = "Audio/Sink" node.name = "~alsa_output[.]platform-238334000[.]audio-controller[.].*" }
    ]
    actions = {
      update-props = {
        priority.session = 950
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
      }
    }
  }
]

wireplumber.settings = {
  linking.follow-default-target = true
}
